<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Order Confirmed | More4Less</title>

  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicons/favicon-16x16.png">
  <link rel="shortcut icon" href="assets/img/favicons/favicon.ico">
  <link rel="manifest" href="assets/img/favicons/site.webmanifest">
  <meta name="theme-color" content="#2E2F33">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════════════════════ */
    :root {
      --red:            #D73C59;
      --red-deep:       #b82e48;
      --green:          #16a05a;
      --green-bg:       rgba(22,160,90,0.08);
      --green-border:   rgba(22,160,90,0.18);

      --bg:             #f8f8f9;
      --bg-card:        #ffffff;
      --bg-right:       #2E2F33;

      --ink:            #1a1a1c;
      --ink-2:          #3d3d40;
      --ink-3:          #87878c;
      --ink-4:          #b8b8bc;
      --ink-on-dark:    #f0f0f2;
      --ink-on-dark-2:  #b8b8c4;
      --ink-on-dark-3:  #78787e;

      --border:         #e8e8ec;
      --border-dark:    rgba(255,255,255,0.10);

      --nav-h:          60px;
      --radius-xl:      18px;
      --radius-lg:      14px;
      --radius-md:      10px;
      --radius-sm:      8px;
      --radius-full:    999px;

      --spring:         cubic-bezier(0.34,1.5,0.64,1);
      --ease-out:       cubic-bezier(0.22,1,0.36,1);
    }

    /* ═══════════════════════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body {
      font-family: 'Figtree', sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Immersive light-mode field — dot grid + drifting glow, the same
       device this brand uses for its full-screen setup hero, just lit
       for day instead of night. */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(26,26,28,0.07) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse 75% 75% at 50% 46%, black 25%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 46%, black 25%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      width: 780px; height: 780px; border-radius: 50%;
      background: radial-gradient(circle, rgba(22,160,90,0.10) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      animation: driftGlow 14s ease-in-out infinite;
    }
    @keyframes driftGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-46%, -53%) scale(1.06); }
    }

    /* ═══════════════════════════════════════════════════════════
       NAV
    ═══════════════════════════════════════════════════════════ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 9000;
      background: var(--bg-right);
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
    }
    .nav-inner {
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 40px;
    }
    .nav-logo img { height: 20px; display: block; }
    .nav-links {
      display: flex;
      align-items: center;
      list-style: none;
      margin-left: auto;
    }
    .nav-links li a {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink-on-dark-2);
      text-decoration: none;
      letter-spacing: 0.01em;
      padding: 0 18px;
      white-space: nowrap;
      position: relative;
      display: inline-block;
      transition: color 0.2s ease;
    }
    .nav-links li a::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 18px; right: 18px;
      width: 0; height: 1.5px;
      background: var(--red);
      border-radius: 2px;
      transition: width 0.3s var(--ease-out);
    }
    .nav-links li a:hover { color: var(--ink-on-dark); }
    .nav-links li a:hover::after { width: calc(100% - 36px); }
    .nav-links .nav-portal a {
      color: #fff;
      font-weight: 600;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.28);
      border-radius: var(--radius-full);
      padding: 6px 16px;
      margin-left: 10px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .nav-links .nav-portal a::after { display: none; }
    .nav-links .nav-portal a:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.50);
    }

    /* Hamburger */
    .menu-trigger {
      display: none;
      cursor: pointer;
      padding: 8px;
      background: none;
      border: none;
      outline: none;
      margin-left: auto;
    }
    .menu-icon {
      width: 22px; height: 16px;
      display: flex; flex-direction: column;
      justify-content: space-between;
    }
    .menu-icon span {
      display: block; width: 100%; height: 1.5px;
      background: rgba(255,255,255,0.8);
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    .menu-trigger.menu-active .menu-icon span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu-trigger.menu-active .menu-icon span:nth-child(2) { opacity: 0; }
    .menu-trigger.menu-active .menu-icon span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile overlay */
    .mobile-overlay {
      position: fixed; inset: 0;
      background: rgba(22,22,24,0.97);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 8500;
      opacity: 0; visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .mobile-overlay.active { opacity: 1; visibility: visible; }
    .mobile-nav-links { list-style: none; text-align: center; padding: 0; margin: 0; }
    .mobile-nav-links li { margin: 18px 0; transform: translateY(16px); opacity: 0; transition: 0.4s ease; }
    .mobile-overlay.active .mobile-nav-links li { transform: none; opacity: 1; }
    .mobile-nav-links li:nth-child(1) { transition-delay: 0.08s; }
    .mobile-nav-links li:nth-child(2) { transition-delay: 0.13s; }
    .mobile-nav-links li:nth-child(3) { transition-delay: 0.18s; }
    .mobile-nav-links li:nth-child(4) { transition-delay: 0.23s; }
    .mobile-nav-links a {
      color: rgba(255,255,255,0.85);
      font-size: 2rem; font-weight: 700;
      text-decoration: none; letter-spacing: -0.03em;
      position: relative; display: inline-block;
      transition: color 0.25s ease;
    }
    .mobile-nav-links a::after {
      content: ''; position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 2.5px;
      background: var(--red); border-radius: 2px;
      transition: width 0.3s var(--ease-out);
    }
    .mobile-nav-links a:hover { color: #fff; }
    .mobile-nav-links a:hover::after { width: 100%; }
    .mobile-nav-links .portal-link a { color: var(--red); }
    .mobile-nav-links .portal-link a::after { background: var(--red); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .menu-trigger { display: block; }
      .nav-inner { padding: 0 24px; }
    }

    /* ═══════════════════════════════════════════════════════════
       CONFIRMATION CONTENT
    ═══════════════════════════════════════════════════════════ */
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes ringPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(22,160,90,0.18); }
      50%       { box-shadow: 0 0 0 12px rgba(22,160,90,0.06); }
    }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    /* Signature moment: a wireless "confirmation ping" — arcs of signal
       drawing outward from the check, echoing what the product actually
       does (a connection landing) rather than a generic success pulse. */
    @keyframes signalArc {
      0%   { opacity: 0; transform: scale(0.72); }
      35%  { opacity: 0.55; }
      100% { opacity: 0; transform: scale(1.28); }
    }
    @keyframes fillBar {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes popDot {
      0%   { transform: scale(0.4); opacity: 0; }
      60%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .wrap {
      height: 100vh;
      padding-top: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 24px;
      padding-right: 24px;
      position: relative;
      z-index: 1;
    }

    .confirm-card {
      max-width: 460px;
      width: 100%;
      text-align: center;
      opacity: 0;
      animation: revealUp 0.7s var(--ease-out) 0.1s forwards;
    }

    /* Check + signal-arc stack */
    .check-stage {
      position: relative;
      width: 96px; height: 96px;
      margin: 0 auto 28px;
      display: flex; align-items: center; justify-content: center;
    }
    .signal-arc {
      position: absolute; inset: 0;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      opacity: 0;
      animation: signalArc 2.2s var(--ease-out) infinite;
    }
    .signal-arc.a2 { animation-delay: 0.55s; }
    .signal-arc.a3 { animation-delay: 1.1s; }

    .check-ring {
      position: relative;
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--green-bg);
      border: 2px solid var(--green-border);
      display: flex; align-items: center; justify-content: center;
      animation: ringPulse 2.5s ease infinite;
    }
    .check-ring svg {
      width: 28px; height: 28px;
      stroke: var(--green); stroke-width: 2.5; fill: none;
      stroke-dasharray: 60; stroke-dashoffset: 60;
      animation: drawCheck 0.55s var(--ease-out) 0.4s forwards;
    }

    .confirm-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 14px 6px 10px;
      border: 1px solid var(--green-border);
      border-radius: var(--radius-full);
      background: rgba(22,160,90,0.07);
      font-size: 0.66rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--green);
      margin-bottom: 22px;
      opacity: 0;
      animation: revealUp 0.6s var(--ease-out) 0.3s forwards;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(22,160,90,0.18);
      animation: pulse 2.5s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(22,160,90,0.18); }
      50%       { box-shadow: 0 0 0 6px rgba(22,160,90,0.08); }
    }

    .confirm-headline {
      font-size: clamp(2.1rem, 4.5vw, 2.9rem); font-weight: 900;
      letter-spacing: -0.045em; line-height: 1.08;
      color: var(--ink);
      margin-bottom: 16px;
      opacity: 0;
      animation: revealUp 0.6s var(--ease-out) 0.38s forwards;
    }
    .confirm-headline em { font-style: normal; color: var(--green); }

    .confirm-body {
      font-size: 0.88rem;
      color: var(--ink-3);
      line-height: 1.7;
      margin-bottom: 30px;
      opacity: 0;
      animation: revealUp 0.6s var(--ease-out) 0.46s forwards;
    }
    .confirm-body strong { color: var(--ink-2); font-weight: 600; }

    /* Order status stepper — this genuinely is a sequence, so the
       numbered/ordered treatment earns its place here. */
    .status-track {
      margin-bottom: 32px;
      opacity: 0;
      animation: revealUp 0.6s var(--ease-out) 0.54s forwards;
    }
    .status-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .status-node {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transform: scale(0.4); opacity: 0;
      animation: popDot 0.4s var(--spring) forwards;
    }
    .status-dot.is-done {
      background: var(--green);
      animation-delay: 0.7s;
    }
    .status-dot.is-done svg {
      width: 11px; height: 11px; stroke: #fff; stroke-width: 3; fill: none;
    }
    .status-dot.is-pending {
      background: var(--bg);
      border: 1.5px solid var(--border);
      animation-delay: 0.95s;
    }
    .status-dot.is-pending .dot-core {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--ink-4);
    }
    .status-dot.is-next {
      animation: popDot 0.4s var(--spring) forwards, nextPulse 2.2s ease 1.3s infinite;
    }
    @keyframes nextPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(26,26,28,0.06); }
      50%       { box-shadow: 0 0 0 6px rgba(26,26,28,0.05); }
    }
    .status-label {
      font-size: 0.66rem; font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink-4);
      white-space: nowrap;
    }
    .status-node.is-done .status-label { color: var(--ink-2); }
    .status-line {
      width: 64px; height: 2px;
      background: var(--border);
      margin: 10px 6px 0;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .status-line::after {
      content: '';
      position: absolute; inset: 0;
      background: var(--green);
      transform-origin: left center;
      transform: scaleX(0);
      animation: fillBar 0.5s var(--ease-out) 0.82s forwards;
    }

    .confirm-cta {
      display: inline-flex;
      align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 18px 28px;
      background: var(--ink); color: #fff;
      border: none; border-radius: var(--radius-full);
      font-family: 'Figtree', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer; text-decoration: none;
      transition: transform 0.4s var(--spring), box-shadow 0.4s ease, background 0.25s ease;
      position: relative; overflow: hidden;
      opacity: 0;
      animation: revealUp 0.6s var(--ease-out) 0.62s forwards;
    }
    .confirm-cta::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.08) 50%, transparent 65%);
      transform: translateX(-130%);
      transition: transform 0.55s var(--ease-out);
    }
    .confirm-cta:hover::before { transform: translateX(130%); }
    .confirm-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.14);
      background: #1a1a1c;
    }
    .confirm-cta:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    .confirm-cta svg {
      width: 15px; height: 15px;
      stroke: currentColor; stroke-width: 2.2; fill: none;
      transition: transform 0.3s var(--spring);
    }
    .confirm-cta:hover svg { transform: translateX(4px); }

    @media (max-width: 540px) {
      .confirm-headline { font-size: 1.7rem; }
      .status-line { width: 40px; }
      .status-label { font-size: 0.6rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .confirm-card, .confirm-badge, .confirm-headline, .confirm-body,
      .status-track, .confirm-cta, .status-dot, .check-ring svg {
        opacity: 1; transform: none;
      }
      .signal-arc { display: none; }
      .status-line::after { transform: scaleX(1); }
      body::after { animation: none; }
    }
  </style>
</head>

<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">
      <img src="assets/img/logos/logo.png" alt="More4Less">
    </a>
    <ul class="nav-links">
      <li class="nav-portal"><a href="https://more4lessplans.ca/portal">My Account</a></li>
    </ul>
    <button class="menu-trigger" id="menuTrigger" aria-label="Open menu">
      <div class="menu-icon">
        <span></span><span></span><span></span>
      </div>
    </button>
  </div>
</nav>

<!-- MOBILE MENU -->
<div class="mobile-overlay" id="mobileOverlay">
  <ul class="mobile-nav-links">
    <li><a href="/#pricing">Pricing</a></li>
    <li><a href="/#faq">FAQ</a></li>
    <li><a href="/contact">Contact</a></li>
    <li class="portal-link"><a href="https://more4lessplans.ca/portal">Dashboard</a></li>
  </ul>
</div>

<!-- CONTENT -->
<div class="wrap">
  <div class="confirm-card">

    <div class="check-stage" aria-hidden="true">
      <span class="signal-arc a1"></span>
      <span class="signal-arc a2"></span>
      <span class="signal-arc a3"></span>
      <div class="check-ring">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>

    <p class="confirm-badge"><span class="badge-dot"></span> Order Confirmed</p>
    <h1 class="confirm-headline">You're <em>all set</em>.</h1>
    <p class="confirm-body">
      <strong>Your order has been received</strong> and is now being processed.
      It will ship within 1–2 business days, and you'll receive a tracking number once it's on the way.
    </p>

    <div class="status-track">
      <div class="status-row">
        <div class="status-node is-done">
          <span class="status-dot is-done">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span class="status-label">Confirmed</span>
        </div>
        <span class="status-line"></span>
        <div class="status-node">
          <span class="status-dot is-pending is-next"><span class="dot-core"></span></span>
          <span class="status-label">Preparing</span>
        </div>
        <span class="status-line"></span>
        <div class="status-node">
          <span class="status-dot is-pending"><span class="dot-core"></span></span>
          <span class="status-label">Shipped</span>
        </div>
      </div>
    </div>

    <a href="/" class="confirm-cta">
      Back to Home
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>

  </div>
</div>

<script>
(function () {
  var trigger = document.getElementById('menuTrigger');
  var overlay = document.getElementById('mobileOverlay');

  function toggleMenu() {
    var open = trigger.classList.toggle('menu-active');
    overlay.classList.toggle('active', open);
    document.body.style.overflow = open ? 'hidden' : '';
  }

  trigger.addEventListener('click', function (e) { e.stopPropagation(); toggleMenu(); });
  overlay.addEventListener('click', function (e) {
    if (!e.target.closest('a') && overlay.classList.contains('active')) toggleMenu();
  });
  overlay.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { if (overlay.classList.contains('active')) toggleMenu(); });
  });
})();
</script>

</body>
</html>
